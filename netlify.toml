[build]
  command = "echo \"API only\""
  publish = "netlify-public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/premium-reading"
  to = "/.netlify/functions/premium-reading"
  status = 200

[[redirects]]
  from = "/api/review-access"
  to = "/.netlify/functions/review-access"
  status = 200
